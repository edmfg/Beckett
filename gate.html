<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>Beckett — Restricted</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/shell.css">
<style>
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:6vw;
    background:
      radial-gradient(ellipse 60% 80% at 50% 120%,rgba(255,45,45,.22),transparent 70%),
      repeating-linear-gradient(90deg,transparent 0 11.1%,rgba(255,255,255,.04) 11.1% 11.2%),
      var(--bg);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(180deg,#000 0%,transparent 22%,transparent 78%,#000 100%);
  }
  .gate{max-width:520px;width:100%;position:relative;z-index:2}
  .gate .brand{
    font-family:var(--display);font-size:16px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--mute);
    display:flex;align-items:center;gap:10px;margin-bottom:30px;
  }
  .gate .brand .dot{
    width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }
  .gate .h-kick{margin-bottom:14px}
  .gate .h-title{font-size:clamp(48px,8vw,90px)}
  .gate-sub{
    font-family:var(--cond);font-size:16px;font-weight:500;
    color:var(--mute);margin-top:20px;line-height:1.4;
  }
  .gate-form{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
  .gate-form input{
    flex:1;min-width:200px;
    background:transparent;border:1.5px solid var(--line-2);color:var(--ink);
    font-family:var(--display);font-size:18px;text-transform:uppercase;
    padding:16px 18px;letter-spacing:.05em;
  }
  .gate-form input:focus{outline:none;border-color:var(--accent)}
  .gate-form button{
    background:var(--accent);color:#000;border:0;cursor:pointer;
    font-family:var(--display);font-size:18px;text-transform:uppercase;
    padding:16px 22px;letter-spacing:.05em;
    transition:transform .15s ease;
  }
  .gate-form button:hover{transform:translateY(-1px)}
  .gate-err{
    font-family:var(--cond);font-size:12px;font-weight:700;
    color:var(--accent);letter-spacing:.2em;text-transform:uppercase;
    margin-top:18px;display:none;
  }
  .gate-foot{
    font-family:var(--cond);font-size:11px;font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;color:var(--mute);
    margin-top:50px;
  }
</style>
</head>
<body>

<div class="gate">
  <div class="brand"><span class="dot"></span>GOOGLE × MFG × NBCU</div>
  <div class="h-kick">Restricted preview</div>
  <h1 class="h-title">
    <span>Signal in.</span>
    <span class="out">Answer out.</span>
  </h1>
  <p class="gate-sub">Internal stakeholder preview. Enter the password to
    open the Beckett explainer.</p>

  <form class="gate-form" method="POST" action="/api/auth" autocomplete="off">
    <input type="password" name="password" placeholder="Password"
           required autofocus autocomplete="current-password">
    <button type="submit">Enter ▸</button>
  </form>
  <div class="gate-err" id="err">● Incorrect password</div>

  <div class="gate-foot">Beckett · Concept 01 / 03 — Too Close To Call</div>
</div>

<script>
  if (new URLSearchParams(location.search).get('e')) {
    document.getElementById('err').style.display = 'block';
  }
</script>

</body>
</html>
